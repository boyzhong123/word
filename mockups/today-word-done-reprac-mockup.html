<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>今日路线 · 点击已完成环节再练</title>
<style>
  :root {
    --green: #22c55e;
    --ink: #111318;
    --gray: #66707a;
    --line: #e1e4e8;
    --bg: #eef1f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    width: 390px;
    min-height: 640px;
    margin: 0 auto;
    position: relative;
    padding: 16px 14px 24px;
  }

  .page-dim { filter: brightness(0.92); }

  .route-card {
    padding: 14px 13px 16px;
    background: linear-gradient(160deg, #e9fff3 0%, #f3fff9 55%, #fff 100%);
    border: 1.5px solid #aee9c2;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(18, 160, 80, 0.10);
  }
  .seg-head { display: flex; align-items: flex-start; gap: 10px; min-height: 52px; }
  .seg-marker { flex: none; width: 89px; height: 52px; }
  .seg-marker img { width: 89px; height: 52px; object-fit: contain; display: block; }
  .seg-sign { flex: 1; margin-left: 4px; padding-top: 2px; }
  .seg-title-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .seg-title { font-size: 14.5px; font-weight: 800; }
  .seg-stage-stars { display: flex; gap: 1.5px; }
  .seg-stage-star { width: 13px; height: 13px; }
  .seg-state { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 800; }

  .seg-steps { position: relative; margin-top: 7px; }
  .seg-rail {
    position: absolute; left: 20px; top: 21px; bottom: 21px;
    width: 2px; background: var(--line); border-radius: 1px;
  }
  .step { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; min-height: 44px; }
  .step-dot {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .step-dot-icon { width: 25px; height: 25px; }
  .step-dot-completed { background: #edf7f0; }
  .step-dot-active { background: #ffedd5; }
  .step-dot-upcoming { background: #f3f4f6; }
  .step-row {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    min-height: 36px; margin-top: 3px; padding: 6px 0;
  }
  .step-row-tapped {
    background: rgba(32, 169, 87, 0.08);
    border-radius: 10px;
    padding: 6px 8px;
    margin-top: 0;
  }
  .step-name { font-size: 13.5px; font-weight: 800; color: #4b5560; }
  .step-status { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; }
  .step-status-completed { color: #20a957; }
  .step-status-upcoming { color: #9aa3ad; }

  .spot {
    flex: 1; padding: 12px; border: 1px solid var(--green); border-radius: 12px;
    background: linear-gradient(155deg, #dcffec 0%, #fff 48%, #eefbf3 100%);
    opacity: 0.72;
  }
  .spot-title { font-size: 18px; font-weight: 900; }
  .spot-hint { margin-top: 3px; font-size: 11.5px; color: var(--gray); }
  .spot-btn {
    margin-top: 10px; height: 36px; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; background: #18b35f; color: #fff; font-size: 14px; font-weight: 900;
  }

  .reprac-mask {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: center; justify-content: center;
    padding: 0 28px;
    background: rgba(20, 28, 38, 0.45);
  }
  .reprac-card {
    width: 100%; padding: 20px 18px 16px;
    background: #fff; border-radius: 14px;
    box-shadow: 0 9px 24px rgba(20, 28, 38, 0.22);
  }
  .reprac-title { font-size: 16px; font-weight: 800; color: #1a2430; }
  .reprac-desc {
    margin-top: 7px; font-size: 11.5px; line-height: 18px; color: #6a7686;
  }
  .reprac-strong { font-weight: 700; color: #0f9b4e; }
  .reprac-remind {
    margin-top: 13px; display: flex; align-items: center; gap: 7px;
  }
  .reprac-check {
    width: 17px; height: 17px; border-radius: 4.5px;
    border: 1px solid #c7cedb; background: #fff;
  }
  .reprac-remind-text { font-size: 11.5px; color: #6a7686; }
  .reprac-actions { margin-top: 15px; display: flex; gap: 10px; }
  .reprac-btn {
    flex: 1; height: 42px; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-size: 13.5px; font-weight: 700;
  }
  .reprac-btn-ghost { background: #f1f4f8; color: #4a5564; }
  .reprac-btn-primary { background: #111318; color: #fff; }

  .caption {
    position: relative; z-index: 1;
    margin-top: 14px; text-align: center;
    font-size: 12px; color: #6a7686; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="page-dim">
    <div class="route-card">
      <div class="seg-head">
        <div class="seg-marker">
          <img src="../assets/pk-build/frames/student-monster-pk-frame-01.png" alt="">
        </div>
        <div class="seg-sign">
          <div class="seg-title-row">
            <div class="seg-title">关卡 2 · 12词</div>
            <div class="seg-stage-stars">
              <img class="seg-stage-star" src="../images/home/stage-star-empty.png" alt="">
              <img class="seg-stage-star" src="../images/home/stage-star-empty.png" alt="">
              <img class="seg-stage-star" src="../images/home/stage-star-empty.png" alt="">
            </div>
          </div>
          <span class="seg-state">正在闯</span>
        </div>
      </div>

      <div class="seg-steps">
        <div class="seg-rail"></div>

        <div class="step">
          <div class="step-dot step-dot-completed">
            <img class="step-dot-icon" src="../images/home/task-word-muted.svg" alt="">
          </div>
          <div class="step-row step-row-tapped">
            <span class="step-name">单词新学</span>
            <span class="step-status step-status-completed"><span>✓</span><span>已完成</span></span>
          </div>
        </div>

        <div class="step">
          <div class="step-dot step-dot-active">
            <img class="step-dot-icon" src="../images/home/task-recitation-active.svg" alt="">
          </div>
          <div class="spot">
            <div class="spot-title">跟读背诵</div>
            <div class="spot-hint">12 个单词，跟着读一遍</div>
            <div class="spot-btn">开始</div>
          </div>
        </div>

        <div class="step">
          <div class="step-dot step-dot-upcoming">
            <img class="step-dot-icon" src="../images/home/task-listening-muted.svg" alt="">
          </div>
          <div class="step-row">
            <span class="step-name">关卡小测</span>
            <span class="step-status step-status-upcoming"><span>○</span><span>待练</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="reprac-mask">
    <div class="reprac-card">
      <div class="reprac-title">再练一次「单词新学」？</div>
      <div class="reprac-desc">
        这个环节已经练过啦。再次练习<span class="reprac-strong">只有刷出更好的成绩才会更新</span>，原成绩不会被拉低，放心练。
      </div>
      <div class="reprac-remind">
        <div class="reprac-check"></div>
        <span class="reprac-remind-text">不再提醒</span>
      </div>
      <div class="reprac-actions">
        <div class="reprac-btn reprac-btn-ghost">取消</div>
        <div class="reprac-btn reprac-btn-primary">去练习</div>
      </div>
    </div>
  </div>

  <p class="caption">点击已完成的「单词新学」→ 弹出再练确认（与成长页同款）</p>
</body>
</html>
